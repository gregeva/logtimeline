# Temporary: the Linux readers of the per-platform cpanfiles, run on each push
# to the issue branch. Deleted before the pull request.

name: 757 Linux readers (temporary)

on:
  push:
    branches:
      - 757-cpanfile-per-platform

jobs:
  linux-readers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Criterion 1: with no platform argument, the generator writes the host's file alone"
        run: |
          uname -s
          rm build/cpanfile.macos build/cpanfile.linux build/cpanfile.windows
          ./build/generate-cpanfile.sh >/dev/null
          echo "Written:"; ls build/cpanfile.*
          git status --short build/
          git checkout -- build/

      - name: "Criterion 5: build/linux-setup.sh"
        run: ./build/linux-setup.sh

      - name: "Criterion 5: the environment check reads build/cpanfile.linux"
        run: |
          perl process/check-environment.pl --condition 3,4
          sed -i "1i requires 'No::Such::Module757';" build/cpanfile.linux
          if perl process/check-environment.pl --condition 3 | tee /tmp/planted.txt; then
            echo "::error::condition 3 passed with a module that does not exist planted in build/cpanfile.linux"
            exit 1
          fi
          grep -q 'build/cpanfile.linux' /tmp/planted.txt
          grep -q 'No::Such::Module757 does not load' /tmp/planted.txt
          git checkout -- build/cpanfile.linux

      - name: "Criterion 5: build/linux-setup.sh --dev-deps"
        run: ./build/linux-setup.sh --dev-deps

      - name: "Criterion 5: the profiling preflight"
        run: |
          bash -x ./tests/profile/profiling-preflight.sh 2>&1 | grep -E '^\+ CPANFILE='
          ./tests/profile/profiling-preflight.sh
